name: daily-wrapup

on:
  schedule:
    # Evidence (runs API + edition footers, 22-24 Nov 2026): :00 crons were delivered
    # 92 min, 2h05 and 10h+ late - GitHub's scheduler backlog on low-activity repos
    # swallows single slots, on-peak or not. Fix: an evening GRID. One 10-minute slot
    # through the 21:00-21:55 window in each DST regime; the first slot to actually
    # fire produces the edition, every later slot self-skips on the duplicate guard,
    # and slots landing outside the evening window are stopped by the script's DST
    # guard (proven: the 07:28/08:01 runs of 25 Nov skipped cleanly).
    #   AEDT (UTC+11): "xx 10" = 21:xx Melbourne, "xx 11" = 22:xx catch-up hour.
    #   AEST (UTC+10): "xx 11" = 21:xx Melbourne, "xx 10" self-skips (DST guard).
    - cron: "5 10 * * *"
    - cron: "15 10 * * *"
    - cron: "25 10 * * *"
    - cron: "35 10 * * *"
    - cron: "45 10 * * *"
    - cron: "55 10 * * *"
    - cron: "5 11 * * *"
    - cron: "15 11 * * *"
    - cron: "25 11 * * *"
    - cron: "35 11 * * *"
    - cron: "45 11 * * *"
    - cron: "55 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-wrapup
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet feedparser pyyaml requests

      - name: Produce edition
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
        run: python scripts/fetch_digest.py

      - name: Commit edition (if produced)
        run: |
          git config user.name "daily-wrapup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add editions/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit (DST guard or duplicate guard skipped)."
          else
            git commit -m "daily wrap up edition $(TZ=Australia/Melbourne date +%Y-%m-%d)"
            git push
          fi
