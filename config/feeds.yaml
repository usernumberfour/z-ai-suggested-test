# Sam's daily wrap up - Path C V1 source configuration
# This file is the editorial source of truth: what gets watched, in priority order.
# Add/remove/reorder feeds freely - no code changes needed. Dead feeds are
# skipped automatically and disclosed in the edition footer.

window_hours: 24          # freshness window (hours)
tolerance_minutes: 30     # small grace added to the window
items_per_region: 5

regions:
  - id: melbourne
    title: "Melbourne & Victoria"
    feeds:
      - name: "ABC News Melbourne"
        url: "https://www.abc.net.au/news/feed/51120/rss.xml"
      - name: "The Age"
        url: "https://www.theage.com.au/rss/feed.xml"

  - id: australia
    title: "Australia (national)"
    feeds:
      - name: "Guardian Australia"
        url: "https://www.theguardian.com/australia-news/rss"

  - id: pacific
    title: "Pacific"
    feeds:
      - name: "RNZ Pacific"
        url: "https://www.rnz.co.nz/rss/pacific"
      - name: "RNZ National"
        url: "https://www.rnz.co.nz/rss/national"

  - id: sea
    title: "Southeast Asia"
    feeds:
      - name: "CNA"
        url: "https://www.channelnewsasia.com/api/v1/rss-outbound-feed?_format=xml"
      - name: "SCMP Asia"
        url: "https://www.scmp.com/rss/91/feed"
        require_any: ["Singapore", "Malaysia", "Indonesia", "Thailand", "Vietnam",
                      "Philippines", "Cambodia", "Myanmar", "Laos", "ASEAN", "APEC",
                      "Jakarta", "Bangkok", "Manila", "Hanoi", "Kuala Lumpur", "Timor"]
      - name: "Rappler"
        url: "https://www.rappler.com/feed/"
      - name: "VnExpress International"
        url: "https://e.vnexpress.net/rss/news.rss"

  - id: india
    title: "India"
    feeds:
      - name: "The Hindu (National)"
        url: "https://www.thehindu.com/news/national/feeder/default.rss"
      - name: "NDTV"
        url: "https://feeds.feedburner.com/ndtvnews-india-news"
      - name: "Business Standard"
        url: "https://www.business-standard.com/rss/latest.rss"

  - id: mideast
    title: "Middle East"
    feeds:
      - name: "Al Jazeera"
        url: "https://www.aljazeera.com/xml/rss/all.xml"
        # AJ's all.xml is global - keep only Middle East items:
        require_any: ["Israel", "Gaza", "Iran", "Lebanon", "Syria", "Iraq", "Saudi",
                      "Qatar", "UAE", "Turkey", "Egypt", "Jordan", "Yemen", "Houthi",
                      "West Bank", "Gulf", "Tehran", "Riyadh", "Dubai", "Palestin",
                      "Hezbollah", "Hamas", "Red Sea"]
      - name: "Middle East Monitor"
        url: "https://www.middleeastmonitor.com/feed/"

  - id: europe
    title: "Europe"
    feeds:
      - name: "Euronews"
        url: "https://www.euronews.com/rss"
      - name: "BBC Europe"
        url: "http://feeds.bbci.co.uk/news/world/europe/rss.xml"
      - name: "Politico Europe"
        url: "https://www.politico.eu/feed/"

  - id: africa
    title: "Africa"
    feeds:
      - name: "BBC Africa"
        url: "http://feeds.bbci.co.uk/news/world/africa/rss.xml"
      - name: "Africanews"
        url: "https://www.africanews.com/feed/"
      - name: "Daily Maverick"
        url: "https://www.dailymaverick.co.za/dmrss/"
      - name: "Premium Times Nigeria"
        url: "https://www.premiumtimesng.com/feed"

  - id: sam
    title: "South America"
    feeds:
      - name: "Buenos Aires Times"
        url: "https://www.batimes.com.ar/feed"
      - name: "BBC Latin America"
        url: "http://feeds.bbci.co.uk/news/world/latin_america/rss.xml"
      - name: "Mercopress"
        url: "https://en.mercopress.com/rss"

  - id: nam
    title: "North America"
    feeds:
      - name: "Guardian US"
        url: "https://www.theguardian.com/us-news/rss"
      - name: "NPR Top Stories"
        url: "https://feeds.npr.org/1001/rss.xml"
      - name: "NPR World"
        url: "https://feeds.npr.org/1004/rss.xml"
      - name: "The Hill"
        url: "https://thehill.com/feed/"
      - name: "BBC US & Canada"
        url: "http://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml"

# Market indices. "days" uses Python weekday(): Mon=0 ... Sun=6.
# Tadawul and EGX trade Sunday-Thursday: days: [6,0,1,2,3]
